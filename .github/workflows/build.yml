name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      all-runtime:
        description: Runtime-test every node instead of the smoke set
        type: boolean
        default: false
      release-dry-run:
        description: Release dry run (check the release notes and test every node, without publishing)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      runtime: ${{ steps.matrix.outputs.runtime }}
      version: ${{ steps.version.outputs.version }}
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release-dry-run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the Full Changelog link
      - name: Read the version and check the tag
        id: version
        run: |
          version="$(sed -n 's/^mod\.version=//p' gradle.properties)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::mod.version '$version' is not SemVer"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mod.version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release notes and Full Changelog link
        if: env.RELEASE == 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          notes=".github/release-notes/$TAG.md"
          [[ -f "$notes" ]] || { echo "::error::missing $notes"; exit 1; }
          ref="$TAG"; git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || ref=HEAD # dry run before tagging
          # The previous version tag; a stable release skips pre-releases (tags with "-").
          stable=(); [[ "$TAG" == *-* ]] || stable=(--exclude '*-*')
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "$TAG" "${stable[@]}" "$ref" 2>/dev/null || true)"
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if [[ -n "$prev" ]]; then link="$base/compare/$prev...$TAG"; else link="$base/commits/$TAG"; fi
          { cat "$notes"; printf '\n**Full Changelog**: %s\n' "$link"; } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - if: env.RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - id: matrix
        # Releases, dry runs and manual runs with all-runtime launch every node; other runs launch the smoke set.
        env:
          ALL_RUNTIME: ${{ env.RELEASE == 'true' || inputs.all-runtime }}
        run: >
          ./gradlew ciMatrix $([ "$ALL_RUNTIME" = true ] && echo --all-runtime)
          --output "$GITHUB_OUTPUT" -q --console=plain -Ptailgate.nodes=none

  core:
    name: core tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17, 21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The last version listed becomes JAVA_HOME; Gradle itself runs on 25.
          java-version: |
            ${{ matrix.java }}
            25
      - uses: gradle/actions/setup-gradle@v6
      - env:
          TEST_JAVA: ${{ matrix.java }}
        run: >
          ./gradlew :core:test --console=plain
          -Ptailgate.testJava="$TEST_JAVA"
          -Porg.gradle.java.installations.fromEnv="JAVA_HOME_${TEST_JAVA}_X64"
          -Porg.gradle.java.installations.auto-download=false
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-report-java${{ matrix.java }}
          path: core/build/reports/tests

  nodes:
    name: nodes (${{ matrix.name }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          # Each group's Minecraft setups take several GB, so all groups' entries can't fit in the
          # 10 GB Actions cache and they evicted each other along with the downloaded dependencies.
          # Leave them and the artifact transforms out: both are rebuilt without the network, and
          # the dependencies stay cached.
          gradle-home-cache-excludes: |
            caches/unimined
            caches/transforms-4
            caches/*/transforms
      - name: Build UI nodes
        env:
          NODES: ${{ matrix.nodes }}
        run: |
          tasks=$(echo "$NODES" | tr ',' '\n' | sed 's/^/:ui:/; s/$/:collectNode/')
          ./gradlew $tasks --console=plain -Ptailgate.nodes="$NODES"
      - uses: actions/upload-artifact@v7
        with:
          name: nodes-${{ matrix.id }}
          path: build/nodes/*.jar
          if-no-files-found: error

  merge:
    needs: [nodes, core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          # Nothing from here on sets up Minecraft, so keep the node jobs' Unimined caches (several
          # GB) out of this job's entry, which the runtime jobs restore too.
          gradle-home-cache-excludes: caches/unimined
      - uses: actions/download-artifact@v8
        with:
          pattern: nodes-*
          merge-multiple: true
          path: build/nodes
      - name: Merge and verify
        run: ./gradlew mergeJar verifyJar --console=plain -Ptailgate.prebuiltNodes=true -Ptailgate.nodes=none
      - name: Resolve the runtime test's dependencies
        # The runtime jobs restore this job's Gradle cache entry, the newest when they start, so they
        # find these here instead of all downloading them from Maven Central at once.
        run: ./gradlew :core:testClasses --console=plain -Ptailgate.nodes=none
      - uses: actions/upload-artifact@v7
        with:
          name: tailgate-jar
          path: build/libs/tailgate-*.jar
          if-no-files-found: error

  runtime:
    name: runtime (${{ matrix.node }})
    needs: [plan, merge]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.plan.outputs.runtime) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # runtimeTest runs each release on one of these, which Gradle finds through JAVA_HOME_<N>_X64.
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Install Xvfb
        # LWJGL 2 (Minecraft 1.12 and older) queries display modes through xrandr; Minecraft 26.3 needs EGL.
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb x11-xserver-utils libegl1 libegl-mesa0
      - uses: actions/download-artifact@v8
        with:
          name: tailgate-jar
          path: build/libs
      - name: Launch Minecraft with the self-test
        env:
          NODE: ${{ matrix.node }}
          # Minecraft 26.3 opens its window with SDL3, whose GLX path finds no matching visual under
          # Xvfb; EGL gets an OpenGL context from Mesa.
          SDL_VIDEO_FORCE_EGL: 1
        run: >
          xvfb-run -a ./gradlew runtimeTest --node "$NODE" --timeout 900 --console=plain -Ptailgate.nodes=none
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
          -Porg.gradle.java.installations.auto-download=false
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.node }}
          path: |
            build/runtime-test/run/${{ matrix.node }}/game.log
            build/runtime-test/run/${{ matrix.node }}/tailgate-selftest.txt
            build/runtime-test/run/${{ matrix.node }}/logs/
            build/runtime-test/fixture.log
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plan, merge, runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tailgate-jar
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      # Create a draft, attach the jar, then publish: immutable releases are locked once published.
      - uses: softprops/action-gh-release@v3
        id: release
        with:
          name: Tailgate v${{ needs.plan.outputs.version }}
          body_path: release-notes.md
          files: dist/tailgate-*.jar
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --jq .html_url
